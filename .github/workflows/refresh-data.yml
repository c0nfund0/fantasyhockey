name: Refresh data

on:
  schedule:
    - cron: "0 9 * * *"   # daily, 09:00 UTC (after the previous night's games)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_data.py --fresh
      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%F)"
          git push
